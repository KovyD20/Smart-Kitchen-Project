services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend1
      - backend2
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - app_net

  backend1:
    build:
      context: ./backend
    container_name: smart-kitchen-backend-1
    environment:
      PORT: ${BACKEND_PORT:-3000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-smart_kitchen}
      DB_USER: ${DB_USER:-smart_user}
      DB_PASSWORD: ${DB_PASSWORD:-smart_pass}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      INSTANCE_NAME: backend1
    expose:
      - "${BACKEND_PORT:-3000}"
    depends_on:
      - postgres
    networks:
      - app_net

  backend2:
    build:
      context: ./backend
    container_name: smart-kitchen-backend-2
    environment:
      PORT: ${BACKEND_PORT:-3000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-smart_kitchen}
      DB_USER: ${DB_USER:-smart_user}
      DB_PASSWORD: ${DB_PASSWORD:-smart_pass}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      INSTANCE_NAME: backend2
    expose:
      - "${BACKEND_PORT:-3000}"
    depends_on:
      - postgres
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    container_name: smart-kitchen-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_kitchen}
      POSTGRES_USER: ${POSTGRES_USER:-smart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "${DB_PORT:-5432}"
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
