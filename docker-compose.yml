services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend1
      - backend2
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    dns:
      - 1.1.1.1
      - 1.1.1.2
      - 1.1.1.3
    networks:
      - app_net

  backend1:
    build:
      context: ./backend
    container_name: smart-kitchen-backend-1
    environment:
      PORT: ${BACKEND_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    dns:
      - 1.1.1.1
      - 1.1.1.2
      - 1.1.1.3
    networks:
      - app_net

  backend2:
    build:
      context: ./backend
    container_name: smart-kitchen-backend-2
    environment:
      PORT: ${BACKEND_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
    expose:
      - "3000"
    depends_on:
      - postgres
    dns:
      - 1.1.1.1
      - 1.1.1.2
      - 1.1.1.3
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    container_name: smart-kitchen-postgres
    env_file:
      - ./compose.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    dns:
      - 1.1.1.1
      - 1.1.1.2
      - 1.1.1.3
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
